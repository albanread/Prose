<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Two beamed eighth notes, drawn on the 64 unit icon grid where Haiku's
       folder overlays go (bottom left, about 4..30 x 32..60). The outline is
       the same parts stroked wide in a dark blue, under the fill, so the
       parts join without seams. -->
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="8" y1="32" x2="28" y2="60">
      <stop offset="0" stop-color="#6f8fe6"/>
      <stop offset="0.45" stop-color="#2b4bb4"/>
      <stop offset="1" stop-color="#16246e"/>
    </linearGradient>
  </defs>
  <g stroke="#0b1236" stroke-width="3" stroke-linejoin="round" fill="#0b1236">
    <rect x="13.6" y="37" width="2.2" height="17.5"/>
    <rect x="27.6" y="33" width="2.2" height="17.5"/>
    <polygon points="13.6,37 29.8,32.6 29.8,37.8 13.6,42.2"/>
    <ellipse cx="10.6" cy="54.6" rx="5.3" ry="3.8" transform="rotate(-22 10.6 54.6)"/>
    <ellipse cx="24.6" cy="50.4" rx="5.3" ry="3.8" transform="rotate(-22 24.6 50.4)"/>
  </g>
  <g fill="url(#ink)">
    <rect x="13.6" y="37" width="2.2" height="17.5"/>
    <rect x="27.6" y="33" width="2.2" height="17.5"/>
    <polygon points="13.6,37 29.8,32.6 29.8,37.8 13.6,42.2"/>
    <ellipse cx="10.6" cy="54.6" rx="5.3" ry="3.8" transform="rotate(-22 10.6 54.6)"/>
    <ellipse cx="24.6" cy="50.4" rx="5.3" ry="3.8" transform="rotate(-22 24.6 50.4)"/>
  </g>
  <!-- light from the top left: a sheen along the beam and on the heads -->
  <g fill="#ffffff" data-hvif-lod="0.4 4">
    <polygon points="14.2,38.2 29.2,34.1 29.2,35.3 14.2,39.4" fill-opacity="0.55"/>
    <ellipse cx="9.2" cy="53.4" rx="2.2" ry="1.1" transform="rotate(-22 9.2 53.4)" fill-opacity="0.6"/>
    <ellipse cx="23.2" cy="49.2" rx="2.2" ry="1.1" transform="rotate(-22 23.2 49.2)" fill-opacity="0.6"/>
  </g>
</svg>
